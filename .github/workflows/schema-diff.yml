name: Generate Prisma baseline SQL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-diff.yml'
  workflow_dispatch:
jobs:
  schema-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate baseline SQL
        run: |
          echo "=== PRISMA_BASELINE_SQL_BEGIN ==="
          npx prisma migrate diff --from-empty --to-schema-datamodel apps/api/prisma/schema.prisma --script
          echo "=== PRISMA_BASELINE_SQL_END ==="
