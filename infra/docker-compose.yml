services:
  postgres:
    image: postgres:16-alpine
    container_name: infinix-pro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinix
      POSTGRES_PASSWORD: infinix_dev
      POSTGRES_DB: infinix_pro
    ports:
      - "5432:5432"
    volumes:
      - infinix_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinix -d infinix_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  infinix_postgres:
